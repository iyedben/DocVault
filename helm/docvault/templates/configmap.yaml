apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docvault.fullname" . }}-config
  labels:
    {{- include "docvault.labels" . | nindent 4 }}
data:
  DATABASE_HOST: {{ .Values.config.databaseHost | quote }}
  DATABASE_PORT: {{ .Values.config.databasePort | quote }}
  DATABASE_NAME: {{ .Values.config.databaseName | quote }}
  DATABASE_USER: {{ .Values.config.databaseUser | quote }}
  AUTH_COOKIE_SECURE: {{ .Values.config.authCookieSecure | quote }}
  DOCUMENT_STORAGE_ROOT: {{ .Values.config.documentStorageRoot | quote }}

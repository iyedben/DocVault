services:
  phase3-test-postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: phase3_test_admin
      POSTGRES_PASSWORD: ${PHASE3_TEST_POSTGRES_PASSWORD:?Set a per-run test password}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,noexec,size=512m
    networks:
      - phase3-test-isolated
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phase3_test_admin -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s

networks:
  phase3-test-isolated:
    driver: bridge

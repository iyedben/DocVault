services:
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  default:
    name: docvault-validation-net
    driver: bridge


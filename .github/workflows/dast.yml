name: DAST Dynamic Security Scan

on:
  push:
    branches:
      - main
      - feature/dast-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    name: OWASP ZAP Dynamic Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'

      - name: Execute DAST scan orchestrator
        run: ./scripts/run_dast_scan.sh

      - name: Upload DAST scan reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dast-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            zap-report.html
            zap-report.json
          retention-days: 7
          if-no-files-found: error

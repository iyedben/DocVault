name: Container Security & Artifact Gate

'on':
  push:
    branches:
      - main
      - feature/container-security
      - feature/python-runtime-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build production container image
        run: |
          echo "Building DocVault production API container image..."
          docker build -t docvault-api:local -f backend/Dockerfile .

      - name: Record built image ID and metadata
        run: |
          BUILD_IMAGE_ID=$(docker inspect --format '{{.Id}}' docvault-api:local)
          echo "BUILD_IMAGE_ID=${BUILD_IMAGE_ID}" >> "$GITHUB_ENV"
          echo "${BUILD_IMAGE_ID}" > build-image-id.txt
          echo "Captured built image ID: ${BUILD_IMAGE_ID}"

      - name: Save container image archive and calculate checksum
        run: |
          echo "Saving container image archive to docvault-api.tar..."
          docker save docvault-api:local -o docvault-api.tar
          echo "Calculating SHA-256 checksum..."
          sha256sum docvault-api.tar > docvault-api.tar.sha256
          echo "Archive checksum:"
          cat docvault-api.tar.sha256

      - name: Upload built container image artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: container-image
          path: |
            docvault-api.tar
            docvault-api.tar.sha256
            build-image-id.txt
          retention-days: 1
          if-no-files-found: error

  scan:
    name: Vulnerability Scan & Policy Validation
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'

      - name: Download container image artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: container-image

      - name: Verify container image archive checksum
        run: |
          echo "Verifying image archive SHA-256 checksum before loading..."
          sha256sum -c docvault-api.tar.sha256

      - name: Load container image into Docker
        run: |
          echo "Loading container image into Docker daemon..."
          docker load -i docvault-api.tar

      - name: Verify loaded image ID against build record
        run: |
          LOADED_IMAGE_ID=$(docker inspect --format '{{.Id}}' docvault-api:local)
          EXPECTED_BUILD_ID=$(cat build-image-id.txt)
          echo "Loaded Image ID:   ${LOADED_IMAGE_ID}"
          echo "Expected Build ID: ${EXPECTED_BUILD_ID}"
          if [ "${LOADED_IMAGE_ID}" != "${EXPECTED_BUILD_ID}" ]; then
            echo "::error::Image integrity check failed: Loaded ID (${LOADED_IMAGE_ID}) does not match Build ID (${EXPECTED_BUILD_ID})."
            exit 2
          fi
          echo "${LOADED_IMAGE_ID}" > scanned-image-id.txt
          echo "Image integrity verified between build and scan stages."

      - name: Scan container image with Grype
        id: grype-scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: "docvault-api:local"
          output-format: "json"
          output-file: "grype-report.json"
          fail-build: false

      - name: Capture scanner execution status
        run: |
          scanner_status=0
          if [ "${{ steps.grype-scan.outcome }}" != "success" ]; then
            scanner_status=2
          fi
          echo "SCANNER_STATUS=${scanner_status}" >> "$GITHUB_ENV"

      - name: Validate scan report against exception register
        run: |
          python scripts/validate_container_scan.py \
            --report grype-report.json \
            --exceptions .github/security/container-exceptions.json \
            --scanner-status "${SCANNER_STATUS:-0}" \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload container scan report artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: container-scan-report
          path: grype-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload scanned image metadata artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: scanned-image-metadata
          path: scanned-image-id.txt
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to Docker Hub
    needs: [build, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Verify Docker Hub publishing credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Docker Hub publishing credentials (DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN) are missing from repository secrets."
            exit 1
          fi
          echo "Docker Hub credentials verified."

      - name: Download container image artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: container-image

      - name: Download scanned image metadata artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: scanned-image-metadata

      - name: Verify container image archive checksum before publishing
        run: |
          echo "Verifying image archive SHA-256 checksum before publishing..."
          sha256sum -c docvault-api.tar.sha256

      - name: Load verified container image into Docker
        run: |
          echo "Loading container image into Docker daemon..."
          docker load -i docvault-api.tar

      - name: Verify loaded image ID matches scanned and built records
        run: |
          LOADED_IMAGE_ID=$(docker inspect --format '{{.Id}}' docvault-api:local)
          BUILD_ID=$(cat build-image-id.txt)
          SCANNED_ID=$(cat scanned-image-id.txt)
          echo "Loaded Image ID:  ${LOADED_IMAGE_ID}"
          echo "Build Image ID:   ${BUILD_ID}"
          echo "Scanned Image ID: ${SCANNED_ID}"
          if [ "${LOADED_IMAGE_ID}" != "${BUILD_ID}" ]; then
            echo "::error::Integrity violation: Loaded Image ID does not match Build ID."
            exit 1
          fi
          if [ "${LOADED_IMAGE_ID}" != "${SCANNED_ID}" ]; then
            echo "::error::Integrity violation: Loaded Image ID does not match Scanned Image ID."
            exit 1
          fi
          echo "Build-to-scan-to-publish image integrity verified."

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push container image to Docker Hub
        run: |
          REGISTRY_REPO="iyedbnaissa/docvault-api"
          COMMIT_TAG="${{ github.sha }}"

          echo "Tagging image ${REGISTRY_REPO}:${COMMIT_TAG} and ${REGISTRY_REPO}:latest..."
          docker tag docvault-api:local "${REGISTRY_REPO}:${COMMIT_TAG}"
          docker tag docvault-api:local "${REGISTRY_REPO}:latest"

          echo "Pushing immutable commit tag: ${REGISTRY_REPO}:${COMMIT_TAG}..."
          docker push "${REGISTRY_REPO}:${COMMIT_TAG}"

          echo "Pushing latest tag: ${REGISTRY_REPO}:latest..."
          docker push "${REGISTRY_REPO}:latest"

          REPO_DIGEST=$(docker inspect --format '{{range .RepoDigests}}{{.}}{{"\n"}}{{end}}' "${REGISTRY_REPO}:${COMMIT_TAG}" | head -n 1)
          echo "Published RepoDigest: ${REPO_DIGEST}"

          echo "### Docker Hub Image Publishing Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository:** \`${REGISTRY_REPO}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit Tag:** \`${COMMIT_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Latest Tag:** \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **RepoDigest:** \`${REPO_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

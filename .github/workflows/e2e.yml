name: Browser E2E Testing

'on':
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright Browser End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt
            requirements-e2e.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-lock.txt -r requirements-e2e.txt

      - name: Install Playwright Chromium browser and system dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Build local container image
        run: |
          echo "Building docvault-api:local for isolated E2E stack..."
          docker build -t docvault-api:local -f backend/Dockerfile .

      - name: Run Playwright E2E test suite
        run: |
          ./scripts/run_e2e_tests.sh backend/tests/e2e --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results

      - name: Upload Playwright test artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-e2e-artifacts
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

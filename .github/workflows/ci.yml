name: CI Foundation

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Environment & Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.14
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt

      - name: Inspect CI environment and runtime versions
        run: |
          echo "=== System Information ==="
          uname -a
          echo "=== Python & Pip Version ==="
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Verify Python bytecode compilation
        run: |
          python -m compileall backend/app backend/tests scripts

      - name: Run Ruff linter and format validation
        run: |
          ruff check .

      - name: Verify application importability
        run: |
          PYTHONPATH=backend python -c "import app.main; print('DocVault FastAPI application successfully imported.')"

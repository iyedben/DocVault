name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          detect --source=/repo --redact --verbose

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:83b9e9ee3df8ab1482dd7680cc78f25f6d9619a0caab7a687cf9eed31e88e4a1 # 1.184.0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep security rules
        run: semgrep scan --config p/default --error --metrics=off

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'

      - name: Install pinned pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Run dependency vulnerability scan
        run: |
          audit_status=0
          pip-audit \
            -r requirements-lock.txt \
            --no-deps \
            --desc \
            -f json \
            -o pip-audit-report.json || audit_status=$?

          echo "AUDIT_EXIT_STATUS=${audit_status}" >> "$GITHUB_ENV"

      - name: Validate audit report against exception register
        if: always()
        run: |
          python scripts/validate_dependency_audit.py \
            --report pip-audit-report.json \
            --exceptions .github/security/dependency-exceptions.json \
            --audit-status "${AUDIT_EXIT_STATUS:-2}" \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload dependency audit artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dependency-audit-report
          path: pip-audit-report.json
          retention-days: 7
          if-no-files-found: ignore
